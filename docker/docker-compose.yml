name: docker

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${INVENTORY_POSTGRES_DB:-inventory}
      POSTGRES_USER: ${INVENTORY_POSTGRES_USER:-inventory_user}
      POSTGRES_PASSWORD: ${INVENTORY_POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in root .env}
    ports:
      - "127.0.0.1:${INVENTORY_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s



volumes:
  postgres_data:
